<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка турнира</title>
    <style>
        body { background: #0d0d0d; color: #fff; font-family: Arial; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #00ffcc; }
        h1 { color: #00ffcc; text-align: center; }
        textarea { width: 100%; height: 150px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 10px; font-size: 16px; margin-bottom: 15px; }
        button { padding: 12px 30px; background: #00ffcc; color: #000; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #00ccaa; }
        .grid { margin-top: 20px; background: #0a0a0a; padding: 15px; border-radius: 10px; border: 1px dashed #00ffcc; }
        .match { padding: 10px; margin: 5px 0; background: #2a2a2a; border-left: 4px solid #00ffcc; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .vs { color: #ff0055; font-weight: bold; padding: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠 Панель организатора</h1>
        <p>Вставь ники участников (каждый с новой строки):</p>
        <textarea id="playersInput" placeholder="Ник1&#10;Ник2&#10;Ник3..."></textarea>
        <button onclick="generateGrid()">🎲 Сгенерировать случайную сетку</button>
        <div class="grid" id="gridOutput"></div>
    </div>

    <script>
        function generateGrid() {
            const input = document.getElementById('playersInput').value;
            let players = input.split('\n').map(p => p.trim()).filter(p => p !== "");
            
            if (players.length < 2) return alert("Нужно хотя бы 2 игрока!");
            
            // Перемешиваем (Fisher-Yates)
            for (let i = players.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [players[i], players[j]] = [players[j], players[i]];
            }

            let html = "";
            for (let i = 0; i < players.length; i += 2) {
                const p1 = players[i];
                const p2 = players[i+1] || "Ожидание...";
                html += `<div class="match"><span>${p1}</span> <span class="vs">VS</span> <span>${p2}</span></div>`;
            }

            document.getElementById('gridOutput').innerHTML = html;
        }
    </script>
</body>
</html>
